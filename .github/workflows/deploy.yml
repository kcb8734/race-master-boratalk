# ══════════════════════════════════════════════════════════════════
#  경마통 Race Master — Cloudflare Pages CI/CD 파이프라인
#  트리거: main 브랜치 push → Flutter 빌드 → Cloudflare Pages 배포
#  도메인: www.boratalk.live
# ══════════════════════════════════════════════════════════════════
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Flutter Web & Deploy

    steps:
      # ── 1. 소스 체크아웃 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter SDK 설치 (3.35.4 버전 고정) ────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      # ── 3. 의존성 설치 ────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 4. 코드 분석 (에러만 차단, info는 허용) ───────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: false

      # ── 5. Flutter Web 릴리즈 빌드 ────────────────────────────────
      #    Framework Preset: None
      #    Build command:    flutter build web --release
      #    Output directory: build/web
      - name: Build Flutter Web (Release)
        run: |
          flutter build web --release \
            --dart-define=flutter.inspector.structuredErrors=false

      # ── 6. Cloudflare Pages 배포 ──────────────────────────────────
      #    Secrets 필요: CF_API_TOKEN, CF_ACCOUNT_ID
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: race-master-boratalk
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # ── 7. 배포 완료 알림 ─────────────────────────────────────────
      - name: Deployment Summary
        run: |
          echo "✅ 배포 완료!"
          echo "🌐 도메인: https://www.boratalk.live"
          echo "📦 빌드: build/web"
          echo "🕐 시각: $(date '+%Y-%m-%d %H:%M:%S KST')"
