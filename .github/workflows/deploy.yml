# ══════════════════════════════════════════════════════════════════════
#  경마통 RE-RACE AI SIMULATOR — Cloudflare Pages CI/CD 파이프라인
#  ▸ 트리거 : main 브랜치 push
#  ▸ 빌드   : flutter build web --release  (Framework Preset: None)
#  ▸ 출력   : build/web
#  ▸ 배포   : wrangler pages deploy (pages-action@v1 deprecated 대체)
#  ▸ Flutter: 3.35.4 (버전 고정)
# ══════════════════════════════════════════════════════════════════════
name: 🏇 Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.4"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Flutter Build → Cloudflare Pages

    permissions:
      contents: read
      deployments: write

    steps:
      # ── 1. 소스 체크아웃 ──────────────────────────────────────────────
      - name: ① Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Flutter SDK 설치 (버전 고정: 3.35.4) ───────────────────────
      - name: ② Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ── 3. Flutter 버전 확인 ───────────────────────────────────────────
      - name: ③ Verify Flutter version
        run: |
          flutter --version
          dart --version

      # ── 4. 의존성 설치 ────────────────────────────────────────────────
      - name: ④ flutter pub get
        run: flutter pub get

      # ── 5. 코드 분석 (info·warning 허용, error만 차단) ───────────────
      # --no-fatal-infos  : info 레벨 → exit 0
      # --no-fatal-warnings: warning 레벨 → exit 0  (dCornB 등 미사용 필드 방어)
      - name: ⑤ flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── 6. Flutter Web 릴리즈 빌드 ────────────────────────────────────
      - name: ⑥ flutter build web --release
        run: |
          flutter build web --release \
            --dart-define=flutter.inspector.structuredErrors=false \
            --dart-define=debugShowCheckedModeBanner=false

      # ── 6-b. CF Pages 라우팅/헤더 파일 복사 ───────────────────────────
      # web/_headers : 보안·캐시·CORS 헤더
      # web/_redirects: SPA 404→index.html fallback
      - name: ⑥-b Copy CF Pages config files
        run: |
          cp web/_headers  build/web/_headers  2>/dev/null && echo "✅ _headers 복사 완료" || echo "⚠️ _headers 없음"
          cp web/_redirects build/web/_redirects 2>/dev/null && echo "✅ _redirects 복사 완료" || echo "⚠️ _redirects 없음"

      # ── 7. 빌드 결과 확인 ─────────────────────────────────────────────
      - name: ⑦ Verify build output
        run: |
          echo "📦 build/web 디렉토리 내용:"
          ls -la build/web/
          echo "📊 총 크기: $(du -sh build/web/ | cut -f1)"
          echo "🔒 CF Pages 설정:"
          [ -f build/web/_headers ]   && echo "  ✅ _headers 존재"   || echo "  ❌ _headers 없음"
          [ -f build/web/_redirects ] && echo "  ✅ _redirects 존재" || echo "  ❌ _redirects 없음"

      # ── 8. Node.js 설치 (wrangler 실행용) ────────────────────────────
      # Node.js 20 deprecated(2026-09-16) → 24로 업그레이드
      - name: ⑧-a Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── 9. Cloudflare Pages 배포 (wrangler pages deploy 직접 사용) ───
      #  pages-action@v1은 deprecated된 wrangler pages publish를 사용하여
      #  /deployments API 호출 실패 → npx wrangler@3 pages deploy 로 대체
      - name: ⑧ Deploy to Cloudflare Pages
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          npx wrangler@3 pages deploy build/web \
            --project-name=race-master-boratalk \
            --branch=main \
            --commit-hash="${COMMIT_SHA}" \
            --commit-message="deploy ${COMMIT_SHA}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ── 10. 배포 완료 요약 ────────────────────────────────────────────
      - name: ⑨ Deployment Summary
        if: success()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  🏇 경마통 배포 완료!                        ║"
          echo "║  🌐 https://www.boratalk.live             ║"
          echo "║  📦 출력: build/web                       ║"
          echo "║  🕐 $(date '+%Y-%m-%d %H:%M UTC')          ║"
          echo "╚══════════════════════════════════════════╝"
